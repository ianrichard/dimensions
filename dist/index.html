<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Explore exact slices and dimensional collapse from 2D, 3D, and 4D shapes."><meta name="theme-color" content="#11191c"><title>Dimension Collapse</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23edf0f4%22/%3E%3Cpath%20d%3D%22m16%204%2010%206v11l-10%206-10-6V10Zm0%200v12m-10-6%2010%206%2010-6m-10%206v11%22%20fill%3D%22none%22%20stroke%3D%22%232f5bd3%22%20stroke-width%3D%222%22/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dimension/dimension.css"><script type="module" src="app.js"></script></head>
<body><main id="shadowLesson" aria-label="Dimension explorer">
<h1 class="sr-only">Dimensions</h1>
<div class="top-controls page-pad">
 <div class="dimension-options" id="dimensionOptions" role="group" aria-label="Dimension"><button type="button" data-dimension="2" aria-pressed="false">2D</button><button type="button" data-dimension="3" aria-pressed="true">3D</button><button type="button" data-dimension="4" aria-pressed="false">4D</button></div>
 <div class="shape-icons" id="shapeIcons" role="group" aria-label="Shape"></div>
</div>
<div class="scene-band"><div id="dimensionHost"></div></div>
<div class="page-pad">
 <div class="pose-row"><button id="playPause" class="play-pause" type="button" aria-label="Pause rotation" title="Pause rotation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button><div id="poseButtons" class="pose-buttons" role="group" aria-label="Orientation presets" aria-describedby="poseHint"></div></div>
 <span id="poseHint" class="sr-only">Each new shape turns from a random orientation to its first pose, then cycles. Interacting stops automatic movement. Play resumes it.</span>
 <p id="sceneThought" class="scene-thought">How much of a shape can its shadow tell you?</p>
 <fieldset class="settings"><legend>Settings</legend>
  <div class="settings-row"><div id="operationControls" class="operation-toggle" role="group" aria-label="Operation"><button id="operationSlice" type="button" aria-pressed="false">Slice</button><button id="operationCollapse" type="button" aria-pressed="true">Collapse</button></div><div id="colorPresets" class="color-presets" role="group" aria-label="Color scheme"></div></div>
  <div class="view-lab"><div id="gapControl4" class="setting"><label for="gapRange4">4D → 3D <output id="gapValue4"></output></label><input id="gapRange4" type="range" min="-256" max="64" step="1" value="0"></div><div id="gapControl3" class="setting"><label for="gapRange3">3D → 2D <output id="gapValue3"></output></label><input id="gapRange3" type="range" min="-256" max="64" step="1" value="8"></div><div id="gapControl2" class="setting"><label for="gapRange2">2D → 1D <output id="gapValue2"></output></label><input id="gapRange2" type="range" min="-256" max="64" step="1" value="32"></div><div id="tiltControl" class="setting"><label for="tiltRange">Tilt <output id="tiltValue">17°</output></label><input id="tiltRange" type="range" min="5" max="90" step="any" value="17"></div></div>
  <p class="setting-note">Negative gaps let the layers overlap.</p>
 </fieldset>
</div></main><noscript>This explorer needs JavaScript to draw the geometry.</noscript></body></html>
