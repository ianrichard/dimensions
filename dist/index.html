<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Explore shapes, their shadows, and exact 3D slices of four-dimensional shapes."><meta name="theme-color" content="#11191c"><title>Dimension Collapse</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23edf0f4%22/%3E%3Cpath%20d%3D%22m16%204%2010%206v11l-10%206-10-6V10Zm0%200v12m-10-6%2010%206%2010-6m-10%206v11%22%20fill%3D%22none%22%20stroke%3D%22%232f5bd3%22%20stroke-width%3D%222%22/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script src="presets.js" defer></script><script src="app.js" defer></script></head>
<body><div class="app">
<header class="header"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 3 11 6.5v13L16 29 5 22.5v-13ZM16 3v13M5 9.5 16 16 27 9.5M16 16v13"/></svg><h1>Dimension Collapse</h1></div></header>
<div class="shape-tools"><div class="shape-icons" id="shapeIcons" role="group" aria-label="Shape and dimension"></div><button type="button" id="rotateSlice" class="icon-button" aria-label="Rotate to the next orientation" title="Rotate to the next orientation"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25 12a10 10 0 1 0 1 9M25 5v8h-8"/></svg></button></div>
<section id="shadowLesson" aria-label="Successive shadows"><div class="shadow-toolbar"><h2 id="shadowTitle">Cube</h2><div id="viewControls" class="view-toggle" role="group" aria-label="Shadow presentation"><button id="viewShadow" type="button" aria-pressed="true" title="Receding view of the 2D shadow">Shadow</button><button id="viewTopdown" type="button" aria-pressed="false" title="Face-on view of the same 2D shadow">Topdown</button></div></div><div id="shadowStage" class="shadow-stage"><div class="view-divider in-stack" id="viewDivider" hidden><span class="divider-rule" id="dividerRule" aria-hidden="true"></span><span class="cut-thumb" id="cutThumb" aria-hidden="true"></span><input id="cutPosition" type="range" min="-1.2" max="1.2" step="any" value="0" orient="vertical" aria-orientation="vertical" aria-label="3D slice position" title="Move the slice up or down"></div><canvas id="shadowCanvas" aria-label="Linked projections"></canvas><div id="shadowSourceHit" tabindex="0" role="group" aria-label="Rotate the 4D source" title="Drag to rotate"></div><div id="shadowHit" tabindex="0" role="group" aria-label="Drag or use arrow keys to rotate. Home resets." title="Drag to rotate"></div></div><p class="projection-note" id="shadowNote"></p></section>
</div><noscript>This explorer needs JavaScript to draw the geometry.</noscript></body></html>
