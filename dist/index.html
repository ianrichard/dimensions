<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Explore exact slices and dimensional collapse from 2D, 3D, and 4D shapes."><meta name="theme-color" content="#11191c"><title>Dimension Collapse</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23edf0f4%22/%3E%3Cpath%20d%3D%22m16%204%2010%206v11l-10%206-10-6V10Zm0%200v12m-10-6%2010%206%2010-6m-10%206v11%22%20fill%3D%22none%22%20stroke%3D%22%232f5bd3%22%20stroke-width%3D%222%22/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dimension/dimension.css"><script type="module" src="app.js"></script></head>
<body><div class="app">
<header class="header"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 3 11 6.5v13L16 29 5 22.5v-13ZM16 3v13M5 9.5 16 16 27 9.5M16 16v13"/></svg><h1>Dimension Collapse</h1></div></header>
<div class="shape-tools"><div class="shape-icons" id="shapeIcons" role="group" aria-label="Shape and dimension"></div></div>
<section id="shadowLesson" aria-label="Dimension explorer"><div class="shadow-toolbar has-operation" id="sceneToolbar"><h2 id="shadowTitle">Cube</h2><div id="operationControls" class="view-toggle" role="group" aria-label="Operation"><button id="operationSlice" type="button" aria-pressed="false">Slice</button><button id="operationCollapse" type="button" aria-pressed="true">Collapse</button></div></div><div id="dimensionHost"></div><div id="poseButtons" class="pose-buttons" role="group" aria-label="Orientation presets" aria-describedby="poseHint"></div><span id="poseHint" class="sr-only">The initial pose holds for five seconds before cycling. Interacting with the current view stops automatic movement.</span><fieldset class="view-lab"><legend>View settings</legend><div id="gapControl4" class="setting"><label for="gapRange4">4D → 3D <output id="gapValue4"></output></label><input id="gapRange4" type="range" min="0" max="64" step="1" value="0"></div><div id="gapControl3" class="setting"><label for="gapRange3">3D → 2D <output id="gapValue3"></output></label><input id="gapRange3" type="range" min="0" max="64" step="1" value="12"></div><div id="gapControl2" class="setting"><label for="gapRange2">2D → 1D <output id="gapValue2"></output></label><input id="gapRange2" type="range" min="0" max="64" step="1" value="32"></div><div id="tiltControl" class="setting"><label for="tiltRange">Tilt <output id="tiltValue">17°</output></label><input id="tiltRange" type="range" min="5" max="90" step="any" value="17"></div></fieldset><div id="colorPresets" class="color-presets" role="group" aria-label="Color scheme"></div></section>
</div><noscript>This explorer needs JavaScript to draw the geometry.</noscript></body></html>
